http:
  port: 8087
server:
  logging:
    - levels: "info|error|warning"
      apiFilter: 'disabled'
  cacheDir: "/usr/local/FileBrowserQuantum/config/tmp"
  sources:
    - path: "/Volume1"
      name: "Volume 1"
    - path: "/Volume2"
      name: "Volume 2"
  database:
    path: /usr/local/FileBrowserQuantum/config/filebrowser.sqlite
    migrateFrom: /usr/local/FileBrowserQuantum/config/filebrowser.db
auth:
  methods:
    password:
      enabled: true
      minLength: 5
      signup: false
    passkey:
      enabled: false

